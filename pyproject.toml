[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-flex-limit"
version = "0.1.0"
description = "Framework-neutral rate limiting core for Django projects"
requires-python = ">=3.10"

[project.optional-dependencies]
redis = ["redis>=5.0"]

[tool.setuptools.packages.find]
include = ["django_flex_limit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
